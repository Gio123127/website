          - heading "It started in 2024" [level=2] [ref=e48]
          - paragraph [ref=e49]: Bliss Nails and Lashes Studio opened in 2024, when Gulshan set up a studio of her own — a calm, private space in Camberley, Hastings, run start to finish by her.
          - paragraph [ref=e50]: "She'd seen how rushed a busy salon can feel: double-booked, hurried, a different person each time. Bliss is the opposite — one artist, one client, and as long as it takes to get it right."
          - paragraph [ref=e51]: That care shows. Bliss holds a 4.9-star rating across around 90 Google reviews, from clients who return as much for the unhurried, one-on-one feel as for the nails and lashes themselves.
